name: Build and make packages
on: [push, pull_request]
jobs:
  build-and-package_DEB_RPM:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3 # enable caching support for action below
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: openboardview.org/linux-build-env:latest
          cache-from: type=gha,scope=linux-build-env
          cache-to: type=gha,scope=linux-build-env
          target: linux-build-env
        env:
          DOCKER_BUILD_CHECKS_ANNOTATIONS: false
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
      - name: Linux build_DEBUG
        run: >
          docker run --rm -t -v "$PWD:$PWD" -w "$PWD" -u "$(id -u):$(id -g)" openboardview.org/linux-build-env:latest sh -c '
          bash ./build.sh --recompile --debug &&
          mv bin/openboardview bin/openboardview_DEBUG
          '
      - uses: actions/upload-artifact@v4
        with:
          name: "openboardview_DEBUG_linux_elf.${{ github.sha }}"
          path: bin/openboardview_DEBUG
      - name: Linux build
        run: >
          docker run --rm -t -v "$PWD:$PWD" -w "$PWD" -u "$(id -u):$(id -g)" openboardview.org/linux-build-env:latest sh -c '
          bash ./build.sh --recompile &&
          cd release_build &&
          make package
          '
      - uses: actions/upload-artifact@v4
        with:
          name: "openboardview_package_linux_deb.${{ github.sha }}"
          path: '*.deb'
      - uses: actions/upload-artifact@v4
        with:
          name: "openboardview_package_linux_rpm.${{ github.sha }}"
          path: '*.rpm'
  crossbuild-32bit-exe-on-mingw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3 # enable caching support for action below
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: openboardview.org/mingw-deb-based-build-env:latest
          cache-from: type=gha,scope=mingw-deb-based-build-env
          cache-to: type=gha,scope=mingw-deb-based-build-env
          target: mingw-deb-based-build-env
        env:
          DOCKER_BUILD_CHECKS_ANNOTATIONS: false
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
      - name: Mingw build debug
        run: >
            docker run --rm -t -v "$PWD:$PWD" -w "$PWD" -u "$(id -u):$(id -g)" openboardview.org/mingw-deb-based-build-env:latest sh -c '
            CROSS=mingw64 ./build.sh --recompile --debug &&
            mv bin/openboardview.exe bin/openboardview_DEBUG.exe
            '
      - uses: actions/upload-artifact@v4
        with:
          name: "openboardview_DEBUG-32bit.exe.${{ github.sha }}"
          path: bin/openboardview_DEBUG.exe
      - name: Mingw build
        run: >
            docker run --rm -t -v "$PWD:$PWD" -w "$PWD" -u "$(id -u):$(id -g)" openboardview.org/mingw-deb-based-build-env:latest sh -c '
            CROSS=mingw64 ./build.sh --recompile
            '
      - uses: actions/upload-artifact@v4
        with:
          name: "openboardview-32bit.exe.${{ github.sha }}"
          path: bin/openboardview.exe
  build-and-package_intel-DMG:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: MacOS dependencies
        run: |
          pip3 install jinja2 --break-system-packages
          brew tap-new local/oldermacos
          ln -s $(pwd)/utilities/brew_oldermacos/sdl2.rb "$(brew --repository local/oldermacos)/Formula/sdl2.rb"
          brew install local/oldermacos/sdl2
      - name: MacOS build
        run: TERM=xterm bash ./build.sh --recompile
      - uses: actions/upload-artifact@v4
        with:
          name: "openboardview_unsigned_macos_intel_dmg.${{ github.sha }}"
          path: '*.dmg'
  build-and-package_universal-DMG:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: MacOS dependencies (jinja2)
        run: pip3 install jinja2 --break-system-packages
      - name: MacOS dependencies (SDL2)
        uses: BrettDong/setup-sdl2-frameworks@v2 # Installing as a framework to build univeral x86_64 + arm64 binary
        with:
          sdl2: 2.32.0
      - name: MacOS build
        run: TERM=xterm SIGNER=- bash ./build.sh --recompile
      - uses: actions/upload-artifact@v4
        with:
          name: "openboardview_adhoc_signed_macos15_universal_dmg.${{ github.sha }}"
          path: '*.dmg'
  build-64bit-exe-on-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Set up shell
        shell: bash
        run: |
          echo 'C:\msys64\usr\bin\' >> "$GITHUB_PATH"
          echo 'C:\msys64\ucrt64\bin\' >> "$GITHUB_PATH"
      - name: Install dependencies
        shell: bash
        run: |
          # Work around stale PGP signatures / corrupted DB on windows-2025 images
          rm -rf /var/lib/pacman/sync/* 2>/dev/null || true
          pacman-key --init 2>/dev/null || true
          pacman-key --populate msys2 2>/dev/null || true
          # Try to refresh keyring without DB signature check
          curl -L -o /tmp/msys2-keyring.pkg.tar.zst https://repo.msys2.org/msys/x86_64/msys2-keyring-r21.b39fb11-1-any.pkg.tar.zst 2>/dev/null || wget -O /tmp/msys2-keyring.pkg.tar.zst https://repo.msys2.org/msys/x86_64/msys2-keyring-r21.b39fb11-1-any.pkg.tar.zst 2>/dev/null || true
          pacman -U --noconfirm /tmp/msys2-keyring.pkg.tar.zst 2>/dev/null || true
          # Disable signature check temporarily for initial sync
          cp /etc/pacman.conf /tmp/pacman.conf.bak 2>/dev/null || true
          sed -i 's/^SigLevel.*/SigLevel = Never/' /etc/pacman.conf 2>/dev/null || echo "SigLevel = Never" >> /etc/pacman.conf
          pacman -Sy --noconfirm || true
          cp /tmp/pacman.conf.bak /etc/pacman.conf 2>/dev/null || sed -i 's/^SigLevel.*/SigLevel = Required DatabaseOptional/' /etc/pacman.conf
          pacman -S --noconfirm --needed msys2-keyring mingw-w64-ucrt-x86_64-keyring 2>/dev/null || true
          pacman-key --populate 2>/dev/null || true
          pacman -Su --noconfirm 2>/dev/null || true
          pacman -S --noconfirm --needed make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-SDL2 mingw-w64-ucrt-x86_64-pkgconf pkgconf
          # Preinstalled python forced into UTF8 mode is used
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install dependencies (jinja2)
        shell: bash
        run: PYTHONUTF8=1 python3 -m pip install jinja2 --break-system-packages
      - name: Build ucrt64 debug
        if: always()
        shell: bash
        run: |
          PYTHONUTF8=1 ./build.sh --debug --recompile
          mv bin/openboardview.exe bin/openboardview_DEBUG.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "openboardview_DEBUG-ucrt64.exe.${{ github.sha }}"
          path: bin/openboardview_DEBUG.exe
      - name: Build ucrt64
        if: always()
        shell: bash
        run: |
          PYTHONUTF8=1 ./build.sh --recompile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "openboardview-ucrt64.exe.${{ github.sha }}"
          path: bin/openboardview.exe
